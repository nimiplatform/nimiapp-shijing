app_id: nimi.shijing
display_name: 时镜 ShiJing
version: 0.1.9
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1430
metadata:
  summary: 结合四柱与节气等确定性排盘，提供个人节律观察与解读。
  icon: src-tauri/icons/icon.png
  readme: APP_GUIDE.md
  release_notes: RELEASE_NOTES.md
  author: Nimi Team
  homepage_url: https://github.com/nimiplatform/nimiapp-shijing
  support_url: https://github.com/nimiplatform/nimiapp-shijing/issues
capability_contract_refs:
  - text.generate
required_standardized_feature_refs: []
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: in-app-only
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: not-applicable
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: false
    telemetry: []
    third_party_account: none
    user_content_sharing: none
    commercial_features: []
    sensitive_data_categories:
      - precise-location
      - health
      - financial
  high_impact_decision_uses: []
storage_policy:
  kind: nimi-mediated-default
