[package]
name = "nimiplatform-shijing-shell"
version = "0.1.0"
description = "ShiJing (时镜) — Personal astrology reading app (Tauri shell)"
authors = ["Nimi Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
nimi-shell-tauri = { path = "../../../nimi/kit/shell/tauri" }

[dev-dependencies]
tempfile = "3"
