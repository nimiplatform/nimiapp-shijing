app_id: nimi.shijing
display_name: 时镜 ShiJing
version: 0.1.9
profile: standalone
npm_package_name: nimiapp-shijing
cargo_package_name: nimiapp-shijing-shell
tauri_identifier: ai.nimi.apps.nimi.shijing
package_author: Nimi Team
submission_role: developer-submitted-input
capability_contract_refs:
  - text.generate
required_standardized_feature_refs: []
storage_policy:
  kind: nimi-mediated-default
safety_profile:
  ai:
    direct_interaction: true
    interaction_notice: absent
    outputs:
      - export_visible_marking: not-applicable
        exposure: in-app-only
        in_product_notice: absent
        machine_readable_marking: absent
        modality: text
        publication_control: not-applicable
    risk_features: []
    subject_notice: not-applicable
  content_descriptors: []
  data_practices:
    commercial_features: []
    publisher_direct_external_network: false
    sensitive_data_categories:
      - precise-location
      - health
      - financial
    telemetry: []
    third_party_account: none
    user_content_sharing: none
  high_impact_decision_uses: []
  intended_audience: general
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
    - personal_birth_data
  user_visible_issue_categories:
    - startup
    - runtime
    - calculation
    - display
  escalation_path: https://github.com/nimiplatform/nimiapp-shijing/issues
  kill_switch_visibility: visible
  recovery_instructions: Restart ShiJing from Nimi Desktop. If the problem persists, reinstall the current admitted release.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
