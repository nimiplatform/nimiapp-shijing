  - id: rule.shijing.algorithm.r009
    kind: rule
    title: Stage and tendency labels
    modality: must
    statement: Product-language stage labels are exactly 进时, 收时, 养时, 转时, and 守时; YueJing tendency class is exactly supportive, steady, watch, blocked, or turning; and tendency classes remain bounded ordinal UI-grouping labels rather than numeric scores, ranks, percentiles, or curve points.
    condition: Whenever stage or YueJing tendency labels are derived or displayed.
    failure: Reject an unrecognized or numericized label.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.snapshot-stage-driver
      - type: applies_to
        target: definition.shijing.algorithm.snapshot-yuejing-tendency-driver
      - type: applies_to
        target: definition.shijing.algorithm.stage-and-tendency-labels
  - id: rule.shijing.algorithm.r010
    kind: rule
    title: Uncertainty decisions
    modality: must
    statement: The BaZi uncertainty baseline sets exact complete inputs to maximum high; rough_day to maximum medium with hour pillar omitted; rough_month to maximum low and failure for DaYun-required mirrors; rough_year to failure for RiJing, YueJing, NianJing, and Runtime consultation; unknown to failure except data-entry repair; missing location, timezone, or ephemeris for exact required pillars to failure; required DaYun with unspecified calculation sex to failure; withheld related-Person consent to maximum medium plus caveat; an unresolved active-tag person mention to omitted person chart plus caveat; incomplete related-Person natal inputs to omitted chart or failure for relation-specific output; no active concern tags to mirror-generation failure; unavailable memory retrieval to continuation only when optional with disclosure; and Runtime-AI parse or validation failure to failure; confidence only decreases at later stages, an engine may tighten through capabilities such as required birth time, and no engine loosens a fail-closed condition.
    condition: Whenever uncertainty or generation readiness is evaluated.
    failure: Fail generation or cap and annotate confidence exactly as the matched decision requires.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.uncertainty-decision-table
  - id: rule.shijing.algorithm.r011
    kind: rule
    title: NianJing derivation
    modality: must
    statement: NianJing derives discrete phase bands and inflection points from deterministic cycle, DaYun, annual, and monthly markers; each phase band contains concern_tag_ref, start_date, end_date, nature, driver_refs, and summary; each inflection point contains concern_tag_ref, date, optional bounded date_window, kind, driver_refs, and summary; date_window never becomes a reusable time container; bands and points are authoritative; and curves, K-line bars, numeric trend series, luck scores, and rankable numbers are forbidden authoritative data.
    condition: Whenever NianJing phase or inflection evidence is derived.
    failure: Reject malformed or forbidden long-horizon evidence.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.nianjing-phase-inflection
      - type: applies_to
        target: definition.shijing.algorithm.snapshot-nianjing-inflection-driver
      - type: applies_to
        target: definition.shijing.algorithm.snapshot-nianjing-phase-driver
  - id: rule.shijing.algorithm.r012
    kind: rule
    title: Canonical hashes
    modality: must
    statement: input_hash and feature_snapshot_hash use sha256, json-c14n-v1, NFC Unicode normalization, utf-8, and lowercase hexadecimal digest; input_hash covers selected method_profile.id, mirror scope, canonical natal inputs, active concern-tag snapshots, resolved person refs, eligible plan refs, cited memory refs, response-preference hash, and deterministic mirror window so different profiles hash distinctly; and feature_snapshot_hash covers the entire method_profile, common, and method_evidence envelope.
    condition: Whenever canonical input or feature evidence is hashed.
    failure: Reject the artifact on missing input coverage or hash mismatch.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.canonical-hashing
      - type: applies_to
        target: definition.shijing.algorithm.feature-snapshot
  - id: rule.shijing.algorithm.r013
    kind: rule
    title: Runtime wording boundary
    modality: must
    statement: Runtime AI receives only common drivers, a read-only method-namespaced display-label evidence projection without recompute hooks, frozen MirrorContextSnapshot, allowed concern-tag prompt text as wording context, policy-admitted cited memory and plan summaries, response preferences, and the mirror output schema, and returns structured JSON matching that schema; it is never asked to calculate pillars, palaces, DaYun or DaXian, solar terms, 四化, stage labels, tendency classes, phase bands, or inflection points, never reads raw method_evidence to rederive common drivers, never succeeds with prose or markdown, never emits fallback copy for Runtime or parse failure, and never lets concern-tag prompt text alter deterministic calculation.
    condition: Whenever Runtime-AI wording is requested or validated.
    failure: Reject the AI output with a typed Runtime or validation failure and persist no Reading.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.runtime-ai-wording
      - type: applies_to
        target: definition.shijing.algorithm.snapshot-common-drivers
  - id: rule.shijing.algorithm.r014
    kind: rule
    title: Implementation coherence
    modality: must
    statement: Canonical algorithm authority remains the source of truth while downstream source contracts, validators, state, persistence, Runtime prompts and parsers, engine adapters, renderer surfaces, and tests are synchronized at every implementation-wave checkpoint without divergence.
    condition: Whenever an implementation wave reaches a checkpoint.
    failure: Block checkpoint closure until every affected downstream surface conforms.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.implementation-coherence
  - id: rule.shijing.algorithm.r015
    kind: rule
    title: BaZi interpretive layer
    modality: must
    statement: "bazi_ziping_v1 uses deterministic fuyi_tiaohou_v1 with 扶抑 primary and 调候 secondary and never emits a numeric luck score: authoritative features are pillar ten gods, hidden stems with 本气, 中气, or 余气 weights, nayin, twelve-growth terrain, day-master strength 极弱 through 极强 with 0 through 1 support_ratio, useful, favorable, and unfavorable elements, and natal branch 合冲刑害破; 空亡, pattern by month command, and five-element distribution are display-authoritative only on MingJing and tendency-neutral everywhere and stay outside the time-mirror hashed envelope; 神煞 and 岁运并临 are computed-but-unweighted or omitted and never drive v1 tendency; strength weights stem and hidden-stem element relations by month-command dominance, day branch, other positions, and hidden-stem class, computes support_ratio as support divided by support plus drain, and bands fixed thresholds; strong charts use overcoming, draining, and consuming 官杀, 食伤, and 财 and disfavor 生扶 印 and 比劫, weak charts use 生扶 and disfavor 克泄耗, balanced charts use a 调候-led balancing element, and extreme winter adds fire or summer adds water unless primarily unfavorable; favorable transits produce supportive, primary unfavorable blocked, other unfavorable watch, neutral steady, and 冲提纲, 岁运并临, or DaYun and annual boundary turning; concern domain selects ten-god focus without overriding useful-element favorability; and for the same 财 transit a strong chart is favorable while a weak chart is unfavorable."
    condition: Whenever BaZi interpretation or tendency is derived.
    failure: Reject interpretation or tendency evidence that violates weighting, authority, or correctness invariants.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.bazi-interpretation
      - type: applies_to
        target: definition.shijing.algorithm.snapshot-bazi-interpretation
  - id: rule.shijing.algorithm.r016
    kind: rule
    title: MingJing natal projection
    modality: must
    statement: The BaZi MingJing surface consumes a deterministic live self MingJingChart from natal canonicalization that is neither a persisted Reading nor part of the time-mirror feature envelope and has no authoritative tendency classes, luck scores, or rankable series; the chart contains self reference, canonicalization hash, natal chart, interpretation, day-pillar 旬空 and per-pillar void flags, weighted and raw five-element distribution, month-command pattern with transparent, rooted, and 成格, 假成, or 破格 disposition, DaYun direction, start age, and full sequence of at least eight periods, salient future LiuNian windows, and exact precision; void branches come from the day-pillar 旬; pattern takes month-branch 本气 ten god, classifies 建禄格 or 阳刃格 for 比劫 by twelve-growth terrain, otherwise prefers transparent 中气 or 余气 over non-transparent 本气, and derives disposition from transparency, rooting, and month-command clash; every DaYun period nature is useful-element favorability of its stem rather than blanket turning; LiuNian emits only years salient by strong favorable or unfavorable year element, branch 冲, 合, 三合, or 刑 with day branch or month command, or a DaYun boundary, over anchor year through anchor plus 12 clamped to DaYun availability, and never degrades into a yearly ledger.
    condition: Whenever the BaZi MingJing natal projection is computed or rendered.
    failure: Reject an inexact, malformed, persisted-as-Reading, trend-shaped, or non-deterministic projection.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.mingjing-bazi-pattern
      - type: applies_to
        target: definition.shijing.algorithm.mingjing-bazi-void
      - type: applies_to
        target: definition.shijing.algorithm.mingjing-chart
      - type: applies_to
        target: definition.shijing.algorithm.mingjing-dayun-period
      - type: applies_to
        target: definition.shijing.algorithm.mingjing-dayun-structure
      - type: applies_to
        target: definition.shijing.algorithm.mingjing-five-element-distribution
      - type: applies_to
        target: definition.shijing.algorithm.mingjing-liunian-projection
      - type: applies_to
        target: definition.shijing.algorithm.mingjing-liunian-window
  - id: rule.shijing.algorithm.r017
    kind: rule
    title: Relationship HePan evidence
    modality: must
    statement: Relationship HePan evidence is computed from self and exactly one Person and includes both subject charts; available pairwise branch interactions across year, month, day, and hour; method-specific direction evidence consisting of BaZi day-master relation, ten-god direction, and useful-element complement or depletion, Ziwei 命宫, 身宫, 主星, and 五行局 direction, or QiZheng ascendant, day or night luminary, house, and mansion direction; anchor-year timing windows from both subjects period markers or an explicit method-namespaced fallback driver; and uncertainty inputs for precision, location, consent, and related-person data; Runtime AI computes or alters none of these fields.
    condition: Whenever relationship evidence is computed or worded.
    failure: Fail relationship generation closed when evidence is incomplete, mismatched, or AI-derived.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.relationship-hepan-evidence
  - id: rule.shijing.algorithm.r018
    kind: rule
    title: Feature and route support
    modality: must
    statement: "RiJing daily, YueJing rolling-30-day, NianJing long-horizon, and ShiJing consultation are algorithm-neutral features, while MingJing resolves a method-specific route, and support declarations are immutable product authority: the three time mirrors support bazi_ziping_v1, ziwei_sanhe_v1, and qizheng_siyu_guolao_v1; consultation supports BaZi and Ziwei only; all three MingJing routes are implemented for natal_projection, natal_reading, and relationship_hepan; before neutral-feature evidence or wording, mirror kind plus scope resolves an active feature and selected method support is validated, with unsupported selection failing at method_feature_support using detail method_feature_not_supported plus feature and method and available alternatives, without switching methods, partial Reading, or AI compensation; before MingJing projection, Reading, or HePan, selected Settings method resolves a route, with unimplemented route failing at mingjing_route_support using mingjing_route_not_implemented plus route and method and unsupported route feature using mingjing_route_feature_not_supported plus route and feature, without alternate route, synthetic output, or AI compensation; absent method setting defaults to bazi_ziping_v1 and unadmitted persisted values fail Settings validation; AI model choice changes wording only and never support; historical Readings retain frozen profile and hashes while switching affects only new generation and live projection; Ziwei supports three time mirrors, cited-Reading consultation, and relationship HePan from self evidence plus exactly one related chart, may render twelve palaces, decadal ranges, and namespaced relationship refs, and limits Runtime AI to admitted natal-brief and HePan prose without calculating palaces, stars, 四化, 大限, or relationship evidence; QiZheng supports MingJing natal, RiJing, YueJing, NianJing, and relationship HePan, renders 七政四余 bodies, houses, mansions, and explicit virtual-model provenance with product labels for raw model ids and 宫势 for position_class, limits MingJing AI to admitted natal-brief wording, derives deterministic concern-domain body, house, and 宫势 drivers for RiJing scope date and YueJing start_date, derives scoreless NianJing bands and annual inflections, exposes only opaque namespaced common refs, derives relationship refs from both charts, and fails consultation until its deterministic mapping is admitted."
    condition: Whenever a feature or MingJing route is resolved, generated, switched, rendered, or worded.
    failure: Fail closed at method_feature_support or mingjing_route_support with the stable applicable detail and no fallback method, route, partial output, or AI compensation.
    relations:
      - type: applies_to
        target: definition.shijing.algorithm.feature-nianjing-long-horizon-reading
      - type: applies_to
        target: definition.shijing.algorithm.feature-rijing-daily-reading
      - type: applies_to
        target: definition.shijing.algorithm.feature-shijing-consultation
      - type: applies_to
        target: definition.shijing.algorithm.feature-yuejing-rolling-30-day-reading
      - type: applies_to
        target: definition.shijing.algorithm.route-mingjing-bazi-ziping-v1
      - type: applies_to
        target: definition.shijing.algorithm.route-mingjing-qizheng-siyu-guolao-v1
      - type: applies_to
        target: definition.shijing.algorithm.route-mingjing-ziwei-sanhe-v1
