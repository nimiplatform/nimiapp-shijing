    kind: rule
    title: Removed-surface reopen trigger
    modality: must_not
    statement: Any exact removed surface or owner-scoped removed Reading field reappears as active product, source, or authority truth.
    condition: Always.
    failure: Fail the authority cut and reopen the migration topic.
