    meaning: Removed placeholder categories are substitute or mocked Reading content, fabricated astrology output, randomized fortune text, completion-marker stubs, empty successful astrology output, Runtime fallback copy, and deterministic-pipeline bypass copy.
  - id: definition.shijing.removed-surfaces.nianjing-visual-boundary
    kind: definition
    title: Removed NianJing visuals
    meaning: NianJing admits phase bands and inflection points but removes authoritative trend charts, K-line bars, luck-score curves, rankable numeric series, and aggregatable scores; decorative interpolation is never persisted, cited, or treated as product truth.
  - id: rule.shijing.removed-surfaces.r001
    kind: rule
    title: Removed product surfaces
    modality: must_not
    statement: Active product surfaces include Huangli mode, daily card, or calendar; Profile entity or Person and Profile duality; Venture, VentureNode, venture board, long-line state, or long-line templates; History tab or global Reading history; monthly report, yearly report, report builder, or report export; luck score, curve, rank, score trend, or percentile fortune; trend chart, luck trend, subject-comparison chart, or K-line authority; customer management, client list or segmentation, or CRM workflow; batch person import or report export; third-party consultant directory, booking flow, or commerce CTA; task, deadline, overdue, dependency, board, milestone, Gantt, progress, priority, or assignee project semantics; View, Focus, View workspace, ViewTemplate, roster, context item, instruction, view memory, or View time-window builder; Relation entity or UI; CurrentObservationTarget switcher; or user-space catalog snapshot.
    condition: Always.
    failure: Reject the active product surface and fail the authority cut closed.
