  - id: rule.shijing.removed-surfaces.r002
    kind: rule
    title: Exact removed-name guards
    modality: must_not
    statement: An active product surface, source entity, source field, source type, validator name, store key, renderer-visible term, or authority unit exactly matches a removed-name definition; a downstream guard admits such an exact match; a guard uses case-insensitive or substring matching; a guard rejects an admitted EventMemory, PlanItem, or ConcernTag name; or Reading admits owner-scoped fields kind, scope, anchor_subject, subjects, time_window, view_id, or ad_hoc_context, while generic discriminators remain legal outside owner scope.
    condition: Always.
    failure: Reject the exact removed name at the guard boundary without rejecting an allowlisted name or unrelated substring.
    relations:
      - type: applies_to
        target: definition.shijing.removed-surfaces.guard-semantics
  - id: rule.shijing.removed-surfaces.r003
    kind: rule
    title: Removed pseudo-success
    modality: must_not
    statement: A successful Reading contains substitute or mocked Reading content, fabricated astrology output, randomized fortune text, a completion-marker stub, empty successful astrology output, Runtime fallback copy, or deterministic-pipeline bypass copy.
    condition: Always.
    failure: Return a typed generation failure and persist no successful Reading.
    relations:
      - type: applies_to
        target: definition.shijing.removed-surfaces.placeholder-pseudo-success
  - id: rule.shijing.removed-surfaces.r004
    kind: rule
    title: Removed NianJing visuals
    modality: must_not
    statement: NianJing treats an authoritative trend chart, K-line bar, luck-score curve, rankable numeric series, or aggregatable score as data, or persists, cites, or treats decorative interpolation as product truth; phase bands and inflection points remain the only admitted authoritative visual forms.
    condition: Always.
    failure: Reject the forbidden NianJing artifact before persistence, citation, or authoritative display.
    relations:
      - type: applies_to
        target: definition.shijing.removed-surfaces.k-line
      - type: applies_to
