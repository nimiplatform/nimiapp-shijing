build_profile_ref: tauri-pnpm-vite
toolchain_version: node>=24;pnpm>=10;rust>=1.80;tauri=2
build_command: pnpm run build:shell
output_path: src-tauri/target/release
lockfile_path: pnpm-lock.yaml
lockfile_policy: author-install-generates-lockfile
ci_install_command: pnpm install --frozen-lockfile
profile_role: developer-workflow-input
test_command: pnpm run test
targets:
  windows-x86_64:
    os: windows
    arch: x86_64
    build_command: pnpm run build:shell
    payload_path: src-tauri/target/release/nimiplatform-shijing-shell.exe
    runtime_entry: payload/nimiplatform-shijing-shell.exe
